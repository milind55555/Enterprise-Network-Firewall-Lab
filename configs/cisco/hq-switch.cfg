! HQ-SW1 - 2960-style access switch
hostname HQ-SW1
no ip domain-lookup
service password-encryption
enable secret CHANGE_ME_ENABLE_SECRET
username netadmin privilege 15 secret CHANGE_ME_ADMIN_SECRET
ip domain-name enterprise-lab.local
crypto key generate rsa modulus 2048
ip ssh version 2

vlan 10
 name HQ-STAFF
vlan 20
 name HQ-GUEST
vlan 30
 name HQ-SERVERS
vlan 99
 name HQ-MANAGEMENT
vlan 999
 name UNUSED-NATIVE

! Trunk to HQ-R1 (router-on-a-stick)
interface GigabitEthernet0/1
 description TRUNK_TO_HQ-R1_G0/0
 switchport mode trunk
 switchport trunk native vlan 999
 switchport trunk allowed vlan 10,20,30,99,999
 no shutdown
exit

! Staff endpoint ports
interface range FastEthernet0/1-8
 description HQ-STAFF-ENDPOINTS
 switchport mode access
 switchport access vlan 10
 spanning-tree portfast
 spanning-tree bpduguard enable
 switchport port-security
 switchport port-security maximum 2
 switchport port-security mac-address sticky
 switchport port-security violation restrict
 no shutdown
exit

! Guest AP / guest wired ports
interface range FastEthernet0/9-12
 description HQ-GUEST-AP-OR-ENDPOINTS
 switchport mode access
 switchport access vlan 20
 spanning-tree portfast
 spanning-tree bpduguard enable
 switchport port-security
 switchport port-security maximum 4
 switchport port-security mac-address sticky
 switchport port-security violation restrict
 no shutdown
exit

! Server ports
interface range FastEthernet0/13-16
 description HQ-SERVER-ENDPOINTS
 switchport mode access
 switchport access vlan 30
 spanning-tree portfast
 spanning-tree bpduguard enable
 switchport port-security
 switchport port-security maximum 2
 switchport port-security mac-address sticky
 switchport port-security violation restrict
 no shutdown
exit

! Management endpoints / AP management ports
interface range FastEthernet0/17-20
 description HQ-MANAGEMENT-ENDPOINTS
 switchport mode access
 switchport access vlan 99
 spanning-tree portfast
 spanning-tree bpduguard enable
 switchport port-security
 switchport port-security maximum 2
 switchport port-security mac-address sticky
 switchport port-security violation restrict
 no shutdown
exit

! Shut down unused ports; adjust ranges if your cabling differs.
interface range FastEthernet0/21-24
 description UNUSED-PORTS
 switchport mode access
 switchport access vlan 999
 shutdown
exit
interface GigabitEthernet0/2
 description UNUSED-PORT
 switchport mode access
 switchport access vlan 999
 shutdown
exit

interface vlan 99
 description SWITCH-MANAGEMENT
 ip address 10.10.99.2 255.255.255.0
 no shutdown
exit
ip default-gateway 10.10.99.1

line console 0
 logging synchronous
 login local
 exec-timeout 10 0
exit
line vty 0 15
 transport input ssh
 login local
 exec-timeout 10 0
exit
spanning-tree portfast default
spanning-tree bpduguard default

end
write memory

! Verify: show vlan brief | show interfaces trunk | show port-security | show ip interface brief
