! BR-R1 - router-on-a-stick, OSPF, DHCP relay, guest ACL
! Adapt interface names to the selected router model before applying.
! Replace CHANGE_ME secrets.

hostname BR-R1
no ip domain-lookup
ip domain-name enterprise-lab.local
service password-encryption
enable secret CHANGE_ME_ENABLE_SECRET
username netadmin privilege 15 secret CHANGE_ME_ADMIN_SECRET
ip ssh version 2
crypto key generate rsa modulus 2048

line console 0
 logging synchronous
 login local
 exec-timeout 10 0
exit
line vty 0 4
 transport input ssh
 login local
 exec-timeout 10 0
exit

! Uplink to branch access switch
interface GigabitEthernet0/0
 description 802.1Q_TRUNK_TO_BR-SW1
 no ip address
 no shutdown
exit

interface GigabitEthernet0/0.10
 description BRANCH_STAFF_VLAN10_GATEWAY
 encapsulation dot1Q 10
 ip address 10.20.10.1 255.255.255.0
 ip helper-address 10.10.30.10
exit

interface GigabitEthernet0/0.20
 description BRANCH_GUEST_VLAN20_GATEWAY
 encapsulation dot1Q 20
 ip address 10.20.20.1 255.255.255.0
 ip helper-address 10.10.30.10
 ip access-group BR-GUEST-IN in
exit

interface GigabitEthernet0/0.30
 description BRANCH_SERVER_VLAN30_GATEWAY
 encapsulation dot1Q 30
 ip address 10.20.30.1 255.255.255.0
exit

interface GigabitEthernet0/0.99
 description BRANCH_MANAGEMENT_VLAN99_GATEWAY
 encapsulation dot1Q 99
 ip address 10.20.99.1 255.255.255.0
 ip helper-address 10.10.30.10
exit

! Routed point-to-point WAN to HQ-R1
interface GigabitEthernet0/1
 description ROUTED_WAN_TO_HQ-R1
 ip address 10.255.0.2 255.255.255.252
 no shutdown
exit

! Guest VLAN policy mirrors HQ guest isolation.
ip access-list extended BR-GUEST-IN
 remark DHCP client traffic to router relay
 permit udp any eq bootpc any eq bootps
 remark DNS only to approved HQ resolver
 permit udp 10.20.20.0 0.0.0.255 host 10.10.30.11 eq domain
 permit tcp 10.20.20.0 0.0.0.255 host 10.10.30.11 eq domain
 remark Block guest access to all RFC1918 destinations
 deny ip 10.20.20.0 0.0.0.255 10.0.0.0 0.255.255.255
 deny ip 10.20.20.0 0.0.0.255 172.16.0.0 0.15.255.255
 deny ip 10.20.20.0 0.0.0.255 192.168.0.0 0.0.255.255
 permit ip 10.20.20.0 0.0.0.255 any
exit

router ospf 10
 router-id 2.2.2.2
 passive-interface default
 no passive-interface GigabitEthernet0/1
 network 10.20.10.0 0.0.0.255 area 0
 network 10.20.20.0 0.0.0.255 area 0
 network 10.20.30.0 0.0.0.255 area 0
 network 10.20.99.0 0.0.0.255 area 0
 network 10.255.0.0 0.0.0.3 area 0
exit

end
write memory

! Verification:
! show ip interface brief
! show ip route
! show ip ospf neighbor
! show ip route ospf
! show access-lists BR-GUEST-IN
