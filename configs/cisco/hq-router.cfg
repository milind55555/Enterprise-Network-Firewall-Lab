! HQ-R1 - router-on-a-stick, OSPF, DHCP relay, guest ACL, pfSense transit
! Adapt interface names to the selected router model before applying.
! Replace CHANGE_ME secrets. Paste in configuration mode in controlled sections.

hostname HQ-R1
no ip domain-lookup
ip domain-name enterprise-lab.local
service password-encryption
enable secret CHANGE_ME_ENABLE_SECRET
username netadmin privilege 15 secret CHANGE_ME_ADMIN_SECRET
ip ssh version 2

! Use your platform's supported RSA key-generation command if prompted.
crypto key generate rsa modulus 2048

line console 0
 logging synchronous
 login local
 exec-timeout 10 0
exit
line vty 0 4
 transport input ssh
 login local
 exec-timeout 10 0
exit

! Uplink to HQ access switch - configure matching trunk on switch Gi0/1
interface GigabitEthernet0/0
 description 802.1Q_TRUNK_TO_HQ-SW1
 no ip address
 no shutdown
exit

interface GigabitEthernet0/0.10
 description HQ_STAFF_VLAN10_GATEWAY
 encapsulation dot1Q 10
 ip address 10.10.10.1 255.255.255.0
 ip helper-address 10.10.30.10
exit

interface GigabitEthernet0/0.20
 description HQ_GUEST_VLAN20_GATEWAY
 encapsulation dot1Q 20
 ip address 10.10.20.1 255.255.255.0
 ip helper-address 10.10.30.10
 ip access-group HQ-GUEST-IN in
exit

interface GigabitEthernet0/0.30
 description HQ_SERVER_VLAN30_GATEWAY
 encapsulation dot1Q 30
 ip address 10.10.30.1 255.255.255.0
exit

interface GigabitEthernet0/0.99
 description HQ_MANAGEMENT_VLAN99_GATEWAY
 encapsulation dot1Q 99
 ip address 10.10.99.1 255.255.255.0
 ip helper-address 10.10.30.10
exit

! Point-to-point routed WAN to BR-R1
interface GigabitEthernet0/1
 description ROUTED_WAN_TO_BR-R1
 ip address 10.255.0.1 255.255.255.252
 no shutdown
exit

! Transit to pfSense LAN interface
interface GigabitEthernet0/2
 description TRANSIT_TO_PFSENSE_LAN
 ip address 10.255.10.2 255.255.255.252
 no shutdown
exit

! Guest VLAN: allow DHCP and internal DNS; deny private destinations; allow public destinations.
ip access-list extended HQ-GUEST-IN
 remark DHCP client traffic to router relay
 permit udp any eq bootpc any eq bootps
 remark DNS only to approved internal resolver
 permit udp 10.10.20.0 0.0.0.255 host 10.10.30.11 eq domain
 permit tcp 10.10.20.0 0.0.0.255 host 10.10.30.11 eq domain
 remark Block guest access to all RFC1918 destinations
 deny ip 10.10.20.0 0.0.0.255 10.0.0.0 0.255.255.255
 deny ip 10.10.20.0 0.0.0.255 172.16.0.0 0.15.255.255
 deny ip 10.10.20.0 0.0.0.255 192.168.0.0 0.0.255.255
 permit ip 10.10.20.0 0.0.0.255 any
exit

! pfSense is the single Internet gateway for both sites.
ip route 0.0.0.0 0.0.0.0 10.255.10.1
! Return route for remote-access VPN client pool.
ip route 10.99.0.0 255.255.255.0 10.255.10.1

router ospf 10
 router-id 1.1.1.1
 passive-interface default
 no passive-interface GigabitEthernet0/1
 network 10.10.10.0 0.0.0.255 area 0
 network 10.10.20.0 0.0.0.255 area 0
 network 10.10.30.0 0.0.0.255 area 0
 network 10.10.99.0 0.0.0.255 area 0
 network 10.255.0.0 0.0.0.3 area 0
 default-information originate
exit

end
write memory

! Verification:
! show ip interface brief
! show ip route
! show ip ospf neighbor
! show ip route ospf
! show access-lists HQ-GUEST-IN
